server:
  port: 8080

spring:
  application:
    name: demo
  datasource:
    url: jdbc:postgresql://localhost:5432/test
    username: postgres
    password: password123
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  batch:
    scheduler:
      interval-seconds: 60
    retry:
      max-attempts: 3
      initial-delay-ms: 1000
      multiplier: 2.0

